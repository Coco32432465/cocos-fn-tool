name: Patchnotes in Discord
on:
  push:
    branches: [main]
    paths: ['app/patchnotes.js']
  workflow_dispatch:
jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - name: Warten, bis Release und Bot-Update fertig sind
        run: sleep 240
      - name: Patchnotes-Embed anstossen
        run: |
          curl -fsS --retry 3 --retry-delay 20 https://cft-license.cocotool.workers.dev/patchnotes | tee out.json
          node -e "const r=JSON.parse(require('fs').readFileSync('out.json','utf8'));if(!r.ok){console.error('Fehler:',r.reason||r.error);process.exit(1)}"
