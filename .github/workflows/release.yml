name: Release bauen

# Startet automatisch, wenn du einen Versions-Tag setzt (z. B. v0.7.2).
# Die Versionsnummer wird aus dem Tag genommen – package.json muss nicht angefasst werden.
on:
  push:
    tags: ['v*']
  workflow_dispatch:   # zusätzlich per Knopf unter "Actions" startbar (nimmt die Version aus package.json)

permissions:
  contents: write      # nötig, damit das Release samt Dateien angelegt werden darf

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
          dotnet-quality: 'ga'

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Version aus Tag übernehmen
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: npm version "${GITHUB_REF_NAME#v}" --no-git-tag-version --allow-same-version

      - name: Parser bauen (ReplayDump.exe)
        shell: bash
        run: dotnet publish parser -c Release -r win-x64 --self-contained -p:PublishSingleFile=true -o bin

      - name: Pakete installieren
        run: npm install

      - name: Installer bauen und als Release hochladen
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx electron-builder --win --publish always
