name = "cft-license"
main = "src/index.js"
compatibility_date = "2025-01-01"

# 0: Ablauf + Erinnerung + Cleanup, 15/45: Patchnotes + Status, 30: Rangliste, jede Minute: Giveaways beenden
[triggers]
crons = ["0 * * * *", "15,45 * * * *", "30 * * * *", "* * * * *"]

# Bot dauerhaft online (Praesenz) ueber ein Durable Object
[[durable_objects.bindings]]
name = "GATEWAY_DO"
class_name = "Gateway"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Gateway"]

[[d1_databases]]
binding = "DB"
database_name = "cft-license"
database_id = "9087d397-0bd3-49ab-91e4-48f060e33a9c"

# Oeffentliche IDs (keine Geheimnisse)
[vars]
# "off" schaltet die Dauer-Online-Verbindung ab
GATEWAY = "on"
DISCORD_APP_ID = "1559989883362091160"
DISCORD_PUBLIC_KEY = "817e93caa2e752cb077d5bf744c039da23178d1124e9ad3a603861f287da60c3"
GUILD_ID = "1175531248836411432"
CUSTOMER_ROLE_ID = "1559988863324262440"
TICKET_CATEGORY_ID = "1175768388975476838"
PANEL_CHANNEL_ID = "1559989415122833428"
ADMIN_USER_IDS = "802638794348167229"
# Preise (nur Anzeige im Ticket-Text)
PRICE_WEEK = "5 €"
PRICE_MONTH = "15 €"
# PayPal.me-Link (leer = Hinweis im Ticket, Team schickt Link)
PAYPAL_URL = ""
PAYPAL_URL_WEEK = "https://py.pl/l0gl0SycxQYIDzi338NY5Q"
PAYPAL_URL_MONTH = "https://py.pl/WSgzhUO4Py161dkZq3I4ow"
# Link fuer den Download-Button (Platzhalter, bitte deine Website eintragen)
DOWNLOAD_URL = "https://cft-license.cocotool.workers.dev/download"
# Erlaubte Website-Adressen fuer Login/API aus dem Browser (kommagetrennt, leer = keine)
ALLOWED_ORIGINS = ""
PAYMENT_TEXT = "Zahlungsart klaerst du im Ticket mit dem Team (z. B. PayPal)."

# Geheimnisse NICHT hier eintragen, sondern mit `wrangler secret put`:
#   BOT_TOKEN, CLIENT_SECRET, SIGNING_KEY, SETUP_SECRET
